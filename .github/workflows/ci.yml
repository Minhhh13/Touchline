name: CI

# Push runs only on main (Render deploys main once this passes); every other branch is checked through its pull request,
# so a branch with an open PR is not built twice. Concurrency cancels a superseded run of the same ref.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The phone's first download: the entry chunk and the stylesheet under their gzip budgets (docs/PERFORMANCE.md)
      - run: npx vitest run src/ui/__tests__/budget.test.ts
        env:
          BUDGET_DIST: '1'
      - run: npm run check:dist-keys
      - run: npm run build:verifier
      - run: npm run check:verifier
