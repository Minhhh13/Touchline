<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="TouchLine: spin the wheel, draft an all-time XI from real players, then manage the season. A football game fusing 38-0's draft with Football Manager's depth." />
    <meta name="theme-color" content="#07102e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" crossorigin />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TouchLine" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>TouchLine</title>
    <script>
      // Paint the right theme before the app loads (App.tsx keeps it in sync afterwards): the saved choice, or the device's for Auto.
      // The choice is mirrored under touchline-theme (src/ui/theme.ts) because the save is compressed; a plain save from an older build is the fallback.
      var pref = null
      try {
        pref = localStorage.getItem('touchline-theme')
        if (!pref) {
          var raw = localStorage.getItem('touchline-save-v1')
          if (raw && raw.charAt(0) === '{') {
            var saved = JSON.parse(raw)
            pref = saved && saved.state && saved.state.profile && saved.state.profile.theme
          }
        }
      } catch (e) {}
      try {
        var light = pref === 'light' || (pref !== 'dark' && !!window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark')
      } catch (e) {}
      // Preload the data Home waits for, so it comes in with the JavaScript instead of after it; the big pack at low
      // priority, after the script where the server orders them. packs.ts and universe.ts fetch with the same default
      // CORS mode and credentials, so the preloads are used. Only on a page no service worker controls (a first visit,
      // the iOS app): a controlled page reads the packs from the worker's cache, and Chromium never matches a
      // preload there (a second request, and a second background refresh, for each)
      try {
        if (!(navigator.serviceWorker && navigator.serviceWorker.controller)) {
          ;['data/leagues.json', 'data/england/meta.json', 'data/england/players.json'].forEach(function (href, i) {
            var link = document.createElement('link')
            link.rel = 'preload'
            link.as = 'fetch'
            link.crossOrigin = 'anonymous'
            link.href = href
            if (i === 2) link.setAttribute('fetchpriority', 'low')
            document.head.appendChild(link)
          })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
