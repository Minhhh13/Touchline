# Supabase CLI configuration for local development (`supabase start`). The hosted project is
# yvqpmyqomkwtudxmkeou (ap-southeast-2); link it with `supabase link --project-ref yvqpmyqomkwtudxmkeou`.
project_id = "touchline"

[api]
enabled = true
port = 54321
# Never expose `private`: its tables are reached only through the public functions.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://localhost:4173/**"]
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
otp_expiry = 900

[storage]
enabled = true

# The Edge Function (deployed per engine as touchline-e{ENGINE_VERSION}): withSupabase checks a user's JWT or the
# publishable key itself, so guests can play the online head-to-head rooms (docs/ONLINE.md section 5e).
[functions.touchline-e6]
verify_jwt = false

# The previous engines' functions stay deployed at least 7 days after the next ships (CLAUDE.md invariant 15;
# docs/ONLINE.md section 7, "Release engine 5" and "Release engine 6"): touchline-e5 to 2026-11-04, touchline-e4 to
# 2026-11-03. Drop each block when its function is deleted.
[functions.touchline-e5]
verify_jwt = false

[functions.touchline-e4]
verify_jwt = false
